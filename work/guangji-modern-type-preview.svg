<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#11130f" flood-opacity=".08"/>
    </filter>
    <g id="wordmark">
      <!-- Modern diagonal corner frame -->
      <path d="M3 15V8a5 5 0 0 1 5-5h19" fill="none" stroke="#171915"
            stroke-width="1.6" stroke-linecap="round"/>
      <path d="M65 23v7a5 5 0 0 1-5 5H41" fill="none" stroke="#171915"
            stroke-width="1.6" stroke-linecap="round"/>
      <path d="M58 3h2a5 5 0 0 1 5 5v2" fill="none" stroke="#df5a3f"
            stroke-width="2.8" stroke-linecap="round"/>
      <text x="9" y="27" font-family="'Songti SC','STSong','Noto Serif CJK SC','PingFang SC',serif"
            font-size="23" font-weight="700" letter-spacing="5" fill="#171915">光迹</text>
    </g>
  </defs>

  <rect width="1200" height="720" fill="#f2f2ef"/>
  <text x="90" y="92" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="22" font-weight="600" fill="#171915">首页头部实际效果</text>

  <g filter="url(#shadow)">
    <rect x="90" y="130" width="1020" height="116" rx="24" fill="#fff"/>
  </g>
  <g transform="translate(124 166) scale(.9)">
    <use href="#wordmark"/>
  </g>

  <text x="502" y="201" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="24" font-weight="650" fill="#171915">推荐</text>
  <rect x="514" y="218" width="32" height="4" rx="2" fill="#171915"/>
  <text x="610" y="201" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="24" font-weight="400" fill="#8b8d88">关注</text>

  <g transform="translate(1038 171)" fill="none" stroke="#171915" stroke-width="3">
    <circle cx="13" cy="13" r="9"/>
    <path d="M20 20L28 28" stroke-linecap="round"/>
  </g>

  <text x="90" y="334" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="22" font-weight="600" fill="#171915">字标细节</text>
  <g filter="url(#shadow)">
    <rect x="90" y="370" width="1020" height="250" rx="30" fill="#fff"/>
  </g>

  <g transform="translate(290 423) scale(3.55)">
    <use href="#wordmark"/>
  </g>
  <text x="620" y="474" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="22" font-weight="500" fill="#777a74">现代宋体</text>
  <text x="620" y="517" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="22" font-weight="500" fill="#777a74">对角框角</text>
  <text x="620" y="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="22" font-weight="500" fill="#777a74">克制的品牌色点缀</text>
</svg>
