<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#11130f" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f2f2ef"/>

  <text x="90" y="92" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="22" font-weight="600" fill="#171915">首页头部实际效果</text>

  <g filter="url(#shadow)">
    <rect x="90" y="130" width="1020" height="116" rx="24" fill="#ffffff"/>
  </g>

  <!-- Header-size logo -->
  <g transform="translate(126 165)">
    <g transform="translate(0 1)">
      <circle cx="18" cy="18" r="15" fill="none" stroke="#171915" stroke-width="2.5"/>
      <path d="M18 3 A15 15 0 0 1 31.3 11.1" fill="none" stroke="#df5a3f"
            stroke-width="3.2" stroke-linecap="round"/>
      <path d="M10.3 6.1 L17.7 17.8 L29.8 12.8" fill="none" stroke="#171915"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="18" r="3.3" fill="#df5a3f"/>
      <path d="M29.5 27.8 C34.5 31 38.5 31 43 29" fill="none" stroke="#171915"
            stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="52" y="29" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
          font-size="24" font-weight="650" letter-spacing="1.5" fill="#171915">光迹</text>
  </g>

  <!-- Center tabs -->
  <text x="502" y="201" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="24" font-weight="650" fill="#171915">推荐</text>
  <rect x="514" y="218" width="32" height="4" rx="2" fill="#171915"/>
  <text x="610" y="201" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="24" font-weight="400" fill="#8b8d88">关注</text>

  <!-- Search -->
  <g transform="translate(1038 171)" fill="none" stroke="#171915" stroke-width="3">
    <circle cx="13" cy="13" r="9"/>
    <path d="M20 20 L28 28" stroke-linecap="round"/>
  </g>

  <text x="90" y="334" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="22" font-weight="600" fill="#171915">标志细节</text>

  <g filter="url(#shadow)">
    <rect x="90" y="370" width="1020" height="250" rx="30" fill="#ffffff"/>
  </g>

  <!-- Enlarged symbol -->
  <g transform="translate(202 422) scale(3.1)">
    <circle cx="18" cy="18" r="15" fill="none" stroke="#171915" stroke-width="2.5"/>
    <path d="M18 3 A15 15 0 0 1 31.3 11.1" fill="none" stroke="#df5a3f"
          stroke-width="3.2" stroke-linecap="round"/>
    <path d="M10.3 6.1 L17.7 17.8 L29.8 12.8" fill="none" stroke="#171915"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="18" r="3.3" fill="#df5a3f"/>
    <path d="M29.5 27.8 C34.5 31 38.5 31 43 29" fill="none" stroke="#171915"
          stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <text x="430" y="502" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="64" font-weight="650" letter-spacing="5" fill="#171915">光迹</text>
  <text x="434" y="552" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif"
        font-size="20" font-weight="400" fill="#777a74">光圈 · 焦点 · 延伸的轨迹</text>
</svg>
