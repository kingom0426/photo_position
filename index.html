<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f2ed">
    <meta name="description" content="光迹——摄影作品、拍摄配方与复刻练习社区">
    <title>光迹 LUMEN</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="icon-button back-button" id="back-button" type="button" aria-label="返回" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <a class="brand" href="#home" aria-label="光迹首页">
          <span class="brand-cn" id="page-title">光迹</span>
          <span class="brand-en" id="page-subtitle">LUMEN FIELD NOTES</span>
        </a>
        <div class="topbar-actions">
          <button class="icon-button" id="search-button" type="button" aria-label="搜索">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          </button>
          <button class="icon-button" type="button" aria-label="通知">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          </button>
        </div>
      </header>

      <div class="search-panel" id="search-panel" hidden>
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search-input" type="search" placeholder="搜索作品、地点、摄影师" autocomplete="off">
        </label>
      </div>

      <main id="main-content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="主导航">
        <a href="#home" data-nav="home" aria-label="首页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
          <span>首页</span>
        </a>
        <a href="#map" data-nav="map" aria-label="地图">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3Z"/><path d="M9 3v15m6-12v15"/></svg>
          <span>地图</span>
        </a>
        <a href="#publish" data-nav="publish" class="publish-nav" aria-label="发布">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>发布</span>
        </a>
        <a href="#plans" data-nav="plans" aria-label="计划">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
          <span>计划</span>
        </a>
        <a href="#profile" data-nav="profile" aria-label="我的">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span>我的</span>
        </a>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
