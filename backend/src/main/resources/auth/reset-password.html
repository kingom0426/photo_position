<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Lumen · 重置密码</title>
  <style>
    * { box-sizing:border-box } body { margin:0;background:#f5f5f3;color:#252525;font-family:system-ui,sans-serif;padding:48px 20px }
    main { max-width:440px;margin:auto;padding:32px 24px;background:white;border-radius:20px }
    .brand { letter-spacing:4px;font-size:13px;color:#73736d } h1 { font-size:25px;margin-top:24px }
    p { line-height:1.7;color:#666 } label { display:block;margin-top:20px;font-size:14px }
    input { display:block;width:100%;font-size:16px;padding:14px;border:1px solid #bbb;border-radius:10px;margin-top:8px }
    button { width:100%;margin-top:28px;padding:15px;border:0;border-radius:10px;background:#292a28;color:white;font-size:16px }
    button:disabled { opacity:.5 } #result { white-space:pre-wrap } .hint { font-size:13px }
  </style>
</head>
<body><main>
  <div class="brand">LUMEN</div><h1>设置新密码</h1>
  <p>重置后，所有设备需要重新登录。</p>
  <form id="reset-form">
    <label for="password">新密码<input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    <label for="confirm">确认新密码<input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    <p class="hint">请使用 8–128 位密码，不要与其他网站重复。</p>
    <button id="submit" type="submit">确认重置</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <p class="hint">链接有效期为 30 分钟，只能使用一次。失效后请在 Lumen 登录页重新申请。</p>
</main><script src="/api/auth/reset-password.js" defer></script></body></html>
