spring:
  application:
    name: lumen-api
  config:
    import: "optional:file:.env.local[.properties],optional:file:.env.mail.local[.properties]"
  mail:
    host: "${MAIL_HOST:smtp.163.com}"
    port: "${MAIL_PORT:465}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:photo_position_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true"
    username: "${DB_USER:}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: "${SERVER_PORT:80}"
  error:
    include-message: never

app:
  mail:
    from: "${MAIL_FROM:}"
    public-base-url: "${PUBLIC_BASE_URL:https://chenxi-edu.com}"
  oss:
    region: "${OSS_REGION:}"
    bucket: "${OSS_BUCKET:}"
    endpoint: "${OSS_ENDPOINT:}"
    access-key-id: "${OSS_ACCESS_KEY_ID:}"
    access-key-secret: "${OSS_ACCESS_KEY_SECRET:}"
    secure: "${OSS_SECURE:true}"
    public-base-url: "${OSS_PUBLIC_BASE_URL:}"
  allowed-origins: "${ALLOWED_ORIGINS:}"
